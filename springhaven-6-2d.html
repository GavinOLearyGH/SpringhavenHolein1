<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Springhaven Six · 2D</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#10251b;font-family:system-ui,-apple-system,sans-serif;color:#203b2b}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:fixed;top:calc(env(safe-area-inset-top) + 14px);left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none;gap:8px}.card{background:#f9f9efed;border-radius:17px;padding:10px 13px;box-shadow:0 5px 18px #0002}.small{font-size:11px;letter-spacing:1px;font-weight:750;color:#65776b}.big{font-size:24px;font-weight:800}.sub{font-size:12px;color:#66766a}#tools{position:fixed;right:12px;top:calc(env(safe-area-inset-top) + 110px);display:grid;gap:8px}button{border:0;border-radius:12px;padding:10px 12px;font-weight:750;background:#f7f8ee;color:#203b2b}#bottom{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 10px);left:10px;right:10px;background:#f7f8ed;border-radius:20px;padding:10px;box-shadow:0 4px 25px #0003}#clubs{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}#clubs button{background:#e4e9df;padding:9px 2px;font-size:15px}#clubs button.active{background:#2e6d4d;color:white}#clubs span{display:block;font-size:11px;font-weight:400;margin-top:3px}#controls{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}#controls button{background:#e5eae1}#msg{font-size:13px;text-align:center;flex:1}#overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0b2115a8;padding:25px}#overlay>div{background:#f7f8ed;padding:24px;border-radius:22px;text-align:center;width:min(360px,100%)}#overlay h2{margin:5px 0 8px}#overlay p{color:#526858}#overlay button{background:#2e6d4d;color:white;width:100%}
</style></head><body><canvas id="game"></canvas><div id="hud"><div class="card"><div class="small">SPRINGHAVEN · 06</div><div class="big">164 yd</div><div class="sub">PAR 3 · TEE</div></div><div class="card"><div class="small">WIND</div><div class="big">↗ 13 mph</div><div class="sub">N bound</div></div></div><div id="tools"><button id="mapBtn">MAP</button><button id="helpBtn">?</button></div><div id="bottom"><div id="clubs"></div><div id="controls"><button id="reset">↺ Reset</button><div id="msg">Touch ball · pull back · release</div><button id="shotBtn">SHOT 1</button></div></div><div id="overlay"><div><h2 id="resultTitle">Shot complete</h2><p id="resultText"></p><button id="again">Take another shot</button></div></div><script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W=0,H=0,dpr=1,scale=1,origin={x:0,y:0};
const clubs=[['PW',125],['9i',140],['8i',152],['7i',165],['6i',178],['5i',190]];let club=3,ball={x:0,y:0},drag=null,flight=null,trail=[],state='ready',shotCount=1,showMap=false;
const tee={x:0,y:0},pin={x:0,y:164},green={x:0,y:164,rx:27,ry:22},pond=[{x:26,y:120},{x:37,y:125},{x:43,y:137},{x:39,y:147},{x:29,y:151},{x:23,y:146},{x:25,y:136},{x:20,y:130}],bunker={x:35,y:170,rx:9,ry:7};
const inPoly=(p,poly)=>{let inside=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if((a.y>p.y)!==(b.y>p.y)&&p.x<(b.x-a.x)*(p.y-a.y)/(b.y-a.y)+a.x)inside=!inside}return inside};
const inEllipse=(p,e)=>((p.x-e.x)/e.rx)**2+((p.y-e.y)/e.ry)**2<=1;
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);scale=Math.min(W/108,(H-290)/220);origin={x:W*.5,y:H-205};draw()}window.addEventListener('resize',resize);
function point(p){return{x:origin.x+p.x*scale,y:origin.y-p.y*scale}}function world(p){return{x:(p.x-origin.x)/scale,y:(origin.y-p.y)/scale}}
function poly(points,fill,stroke,width=1){ctx.beginPath();points.forEach((p,i)=>{const q=point(p);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)});ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke()}}
function ellipse(e,fill,stroke,width=1){const q=point(e);ctx.beginPath();ctx.ellipse(q.x,q.y,e.rx*scale,e.ry*scale,-.06,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke()}}
function line(a,b,color,width=2,dash=[]){const p=point(a),q=point(b);ctx.beginPath();ctx.setLineDash(dash);ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke();ctx.setLineDash([])}
function label(s,p,color='#f7f6df',size=12){const q=point(p);ctx.fillStyle=color;ctx.font='700 '+size+'px system-ui';ctx.textAlign='center';ctx.fillText(s,q.x,q.y)}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#bcd3d4';ctx.fillRect(0,0,W,H);ctx.fillStyle='#679e5e';ctx.fillRect(0,origin.y-205*scale,W,H);
 // Course aligned vertically: tee bottom, green top, pond to golfer's right.
 poly([{x:-60,y:0},{x:60,y:0},{x:57,y:190},{x:-55,y:190}],'#629b59');
 poly([{x:-30,y:-5},{x:31,y:-5},{x:32,y:35},{x:26,y:85},{x:24,y:123},{x:20,y:147},{x:-30,y:150},{x:-25,y:100},{x:-34,y:45}],'#84b574');
 for(let i=0;i<5;i++){ellipse({x:0,y:155+i*7,rx:31+i*2,ry:23+i*3},i%2?'#76a962':'#7aaf69')}
 poly(pond,'#327e95','#c2d8c7',2);poly([{x:22,y:129},{x:25,y:143},{x:29,y:151},{x:33,y:152}],null,'#b9b4a6',5);
 ellipse(bunker,'#e7ddba','#cfc7a5',1);ellipse({x:0,y:164,rx:32,ry:26},'#9bc980');ellipse(green,'#c5dfa2','#a8c98d',2);
 // Pond side stone retaining wall, separate from the green's front edge.
 line({x:18,y:140},{x:28,y:152},'#b8b5aa',6);
 const flag=point(pin);ctx.strokeStyle='#f7f5e9';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(flag.x,flag.y);ctx.lineTo(flag.x,flag.y-25);ctx.stroke();ctx.fillStyle='#f6e7a8';ctx.beginPath();ctx.moveTo(flag.x,flag.y-25);ctx.lineTo(flag.x+16,flag.y-20);ctx.lineTo(flag.x,flag.y-15);ctx.fill();
 // Water fountain and ripple
 const f=point({x:32,y:138});ctx.strokeStyle='#c5f1ee';ctx.lineWidth=1.5;for(let r=6;r<=16;r+=5){ctx.beginPath();ctx.ellipse(f.x,f.y,r,r*.5,0,0,Math.PI*2);ctx.stroke()}ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(f.x,f.y-12);ctx.stroke();
 if(showMap){label('GREEN', {x:-2,y:195});label('POND →',{x:35,y:115});label('TEE',{x:0,y:14});}
 if(drag){const delta={x:drag.start.x-drag.current.x,y:drag.start.y-drag.current.y},len=Math.hypot(delta.x,delta.y),power=Math.min(1,len/120);if(len>2){const aim={x:ball.x+(delta.x/len)*clubs[club][1]*power,y:ball.y+(delta.y/len)*clubs[club][1]*power};line(ball,aim,'#fff3ba',5,[10,9]);const a=point(aim);ctx.fillStyle='#fff1ad';ctx.beginPath();ctx.arc(a.x,a.y,7,0,Math.PI*2);ctx.fill();const b=point(ball);ctx.beginPath();ctx.arc(b.x,b.y,30,0,Math.PI*2);ctx.strokeStyle='#f8e4a5';ctx.lineWidth=4;ctx.stroke();}}
 if(trail.length>1){ctx.beginPath();trail.forEach((p,i)=>{const q=point(p);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)});ctx.strokeStyle='#fff9dfb0';ctx.lineWidth=2;ctx.stroke()}
 const p=point(ball);ctx.fillStyle='#243e2b55';ctx.beginPath();ctx.ellipse(p.x+3,p.y+5,8,4,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x,p.y,8,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#cbd7c8';ctx.stroke();
}
function updateClubs(){document.getElementById('clubs').innerHTML=clubs.map((c,i)=>'<button data-i="'+i+'" class="'+(i===club?'active':'')+'">'+c[0]+'<span>'+c[1]+'y</span></button>').join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{if(state==='ready'){club=+b.dataset.i;updateClubs()}})}
function screenPos(e){return{x:e.clientX,y:e.clientY}}canvas.addEventListener('pointerdown',e=>{if(state!=='ready')return;const p=screenPos(e),b=point(ball);if(Math.hypot(p.x-b.x,p.y-b.y)<95){drag={start:world(p),current:world(p)};canvas.setPointerCapture(e.pointerId);draw()}});
canvas.addEventListener('pointermove',e=>{if(!drag)return;drag.current=world(screenPos(e));draw()});
canvas.addEventListener('pointerup',e=>{if(!drag)return;const v={x:drag.start.x-drag.current.x,y:drag.start.y-drag.current.y};drag=null;const mag=Math.hypot(v.x,v.y);if(mag<4){draw();return}const power=Math.min(1,mag/(120/scale));const distance=clubs[club][1]*power;const dir={x:v.x/mag,y:v.y/mag};launch(dir,distance)});
function launch(dir,distance){state='flight';document.getElementById('msg').textContent='Ball in flight…';const start={...ball};const end={x:start.x+dir.x*distance+distance*.012,y:start.y+dir.y*distance+distance*.015};let t0=performance.now(),duration=850;trail=[{...ball}];function step(now){const t=Math.min(1,(now-t0)/duration);const eased=t;ball={x:start.x+(end.x-start.x)*eased,y:start.y+(end.y-start.y)*eased};if(trail.length===0||Math.hypot(ball.x-trail[trail.length-1].x,ball.y-trail[trail.length-1].y)>1)trail.push({...ball});draw();if(t<1){requestAnimationFrame(step)}else{roll(dir,Math.min(12,distance*.07))}}requestAnimationFrame(step)}
function roll(dir,distance){let start={...ball},t0=performance.now();function step(now){let t=Math.min(1,(now-t0)/650),e=1-(1-t)**2;ball={x:start.x+dir.x*distance*e,y:start.y+dir.y*distance*e};draw();if(t<1)requestAnimationFrame(step);else finish()}requestAnimationFrame(step)}
function finish(){state='done';let water=inPoly(ball,pond),greenHit=inEllipse(ball,green),bunkerHit=inEllipse(ball,bunker);let outcome=water?'WATER':greenHit?'ON THE GREEN':bunkerHit?'BUNKER':'OFF THE GREEN';document.getElementById('resultTitle').textContent=outcome;document.getElementById('resultText').textContent=water?'The ball finished in the pond.':greenHit?'The ball landed and rolled out on the putting surface.':bunkerHit?'Your ball finished in the right greenside bunker.':'Your ball finished on the approach or rough.';document.getElementById('overlay').style.display='flex';document.getElementById('msg').textContent=outcome}
function reset(){ball={...tee};trail=[];drag=null;state='ready';document.getElementById('overlay').style.display='none';document.getElementById('msg').textContent='Touch ball · pull back · release';draw()}
document.getElementById('reset').onclick=reset;document.getElementById('again').onclick=reset;document.getElementById('mapBtn').onclick=()=>{showMap=!showMap;draw()};document.getElementById('helpBtn').onclick=()=>alert('Drag backward from the ball and release. Pull left to launch right. Aim and ball movement share the same overhead coordinates.');updateClubs();resize();
</script></body></html>
